# UAV vehicle detection experiment configuration for YOLO26s-based paper baseline
# EVD4UAV class mapping used by the UAV paper experiments:
# car=0, bus=1, truck=2

model: ultralytics/cfg/models/26/yolo26s_uav.yaml
task: detect
mode: train

# data
data: ultralytics/cfg/datasets/EVD4UAV.yaml

# optimization
epochs: 200
batch: 16
imgsz: 960
optimizer: auto
lr0: 0.0015
lrf: 0.1
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 50
amp: true
workers: 8

# UAV / small-object settings
multi_scale: 0.2
close_mosaic: 15
mosaic: 1.0
mixup: 0.05
copy_paste: 0.0
degrees: 12.0
translate: 0.12
scale: 0.75
flipud: 0.3
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

# class imbalance and noisy-label robustness
cls: 1.2
cls_pw: 0.5
use_uav_loss: true
uav_loss_gamma: 1.0
uav_loss_alpha: 0.5
uav_noise_beta: 0.05
uav_tail_temperature: 1.0
uav_loss_trunc: 3.0
uav_loss_weight: 0.05
tail_class_idx: [1, 2] # bus/truck class indices in EVD4UAV
tail_class_boost: 1.15
manual_class_weights: []

# weighted sampling for bus/truck
use_weighted_sampler: false
sample_weight_power: 0.6
sample_tail_gain: 1.0
sample_tail_classes: [1, 2] # bus/truck class indices in EVD4UAV

# validation / logging
plots: true
save: true
val: true
project: runs/uav
name: yolo26s_uav_evd4uav
