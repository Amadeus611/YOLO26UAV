# UAV vehicle detection experiment configuration for YOLO26s-based paper baseline
# Update data path and tail_class_idx according to the real EVD4UAV class mapping.

model: ultralytics/cfg/models/26/yolo26s_uav.yaml
task: detect
mode: train

# data
# Replace with your actual EVD4UAV yaml path before training.
data: ultralytics/cfg/datasets/VisDrone.yaml

# optimization
epochs: 200
batch: 16
imgsz: 960
optimizer: auto
lr0: 0.0015
lrf: 0.1
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 50
amp: true
workers: 8

# UAV / small-object settings
multi_scale: 0.2
close_mosaic: 15
mosaic: 1.0
mixup: 0.05
copy_paste: 0.0
degrees: 12.0
translate: 0.12
scale: 0.75
flipud: 0.3
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

# class imbalance and noisy-label robustness
cls: 0.8
cls_pw: 0.5
use_uav_loss: true
uav_loss_gamma: 2.0
uav_loss_alpha: 0.3
uav_noise_beta: 0.2
uav_tail_temperature: 1.1
uav_loss_trunc: 3.0
tail_class_idx: [5, 6] # TODO: replace with actual bus/truck indices
tail_class_boost: 1.35
manual_class_weights: []

# weighted sampling for bus/truck
use_weighted_sampler: true
sample_weight_power: 0.6
sample_tail_gain: 1.4
sample_tail_classes: [5, 6] # TODO: replace with actual bus/truck indices

# validation / logging
plots: true
save: true
val: true
project: runs/uav
name: yolo26s_uav_evd4uav
